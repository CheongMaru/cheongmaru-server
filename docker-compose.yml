services:
  mysql:
    image: mysql:8.0
    container_name: cheongmaru-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: cheongmarudb
      MYSQL_USER: cheongmaru
      MYSQL_PASSWORD: cheongmarupw
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cheongmaru-net
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucheongmaru", "-pcheongmarupw"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:

networks:
  cheongmaru-net:
    driver: bridge
